name: Deploy Quartz site to GitHub Pages
 
on:
  push:
    branches:
      - master
 
permissions:
  contents: read
  pages: write
  id-token: write
 
concurrency:
  group: "pages"
  cancel-in-progress: false
 
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Quartz
        uses: actions/checkout@v4
        with:
          repository: andrea-bonari/quartz
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for git info
          path: contents
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Quartz setup
        run: ./setup.sh "Geometria e algebra lineare" "andrea-bonari.github.io/geometria-e-algebra-lineare" "https://github.com/andrea-bonari/geometria-e-algebra-lineare"
      - name: Install Dependencies
        run: npm ci
      - name: Build Quartz
        run: npx quartz build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
 
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4